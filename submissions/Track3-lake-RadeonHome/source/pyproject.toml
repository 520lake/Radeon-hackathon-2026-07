[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radeon-home"
version = "0.1.0"
description = "Language-guided, failure-aware household manipulation on AMD Radeon GPUs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
radeon-home = "radeon_home.cli:main"
radeon-home-dashboard = "radeon_home.dashboard:main"

[tool.setuptools.packages.find]
include = ["radeon_home*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
